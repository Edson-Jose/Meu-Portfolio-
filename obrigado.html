<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada | Edson Silva</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .obrigado-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background-color: var(--bg-dark, #080d1a);
            color: #ffffff;
        }
        .icon-sucesso {
            font-size: 4rem;
            color: var(--primary, #3b82f6);
            margin-bottom: 1.5rem;
        }
        .obrigado-container h1 {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }
        .obrigado-container p {
            color: var(--text-gray, #94a3b8);
            margin-bottom: 2rem;
            max-width: 480px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="obrigado-container">
        <i class="fa-solid fa-circle-check icon-sucesso"></i>
        <h1>Mensagem Enviada!</h1>
        <p>Obrigado pelo contato. Sua mensagem foi recebida com sucesso e responderei o mais breve possível.</p>
        <a href="index.html" class="btn btn-primary">Voltar ao Portfólio</a>
    </div>
</body>
</html>
